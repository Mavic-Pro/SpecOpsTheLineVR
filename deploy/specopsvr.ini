# SpecOpsVR - configuration (read when the game starts).
# One command per line; lines starting with # are comments.
# The same commands can be sent at runtime through specopsvr_cmd.txt.

# ---- VR runtime ----------------------------------------------------------------
# steamvr = through SteamVR (OpenVR). openxr = the OpenXR runtime that is active
# on this PC (Meta Quest Link, Virtual Desktop VDXR, SteamVR, Pimax...), no
# SteamVR needed. auto (default) = Virtual Desktop (VDXR) when the Virtual
# Desktop Streamer is running, otherwise SteamVR. Takes effect at the next
# game start.
runtime auto
# OpenXR only: runtime json to use instead of the active one (for tests), e.g.
# C:\Program Files\Oculus\Support\oculus-runtime\oculus_openxr_32.json. auto = active runtime.
openxrjson auto
# OpenXR only: controller poses are converted from the OpenXR grip pose to the
# SteamVR Touch pose (pitch in degrees from SteamVR's Touch model); "off" =
# plain grip pose. It places the palm and the left hand; the gun follows the
# runtime's aim pose (measured), and openxrgrip - 60 only until it is measured.
openxrgrip 20.6

# ---- Stereo and view ---------------------------------------------------------
# Half the distance between the eyes in Unreal units (~2 cm per unit):
# 1.6 = ~6.4 cm. "sync" = synchronous stereo (recommended), "afr" = alternate.
stereo 1.6 sync
# Field of view: "auto" = from the headset, or degrees, e.g. "fov 100".
fov auto
# Motion blur and depth of field: off is recommended in VR.
postfx off
# HUD and menus: scale towards the centre (1 = original) and apparent distance
# in Unreal units (0 = infinity). Full-screen effects (blood at the edges when
# hurt, flashes) always cover the whole view.
hud 0.4 100

# ---- Head movement (6DOF) ----------------------------------------------------
# If the horizon turns the wrong way when tilting your head: rollsign -1
rollsign 1
# Head in walls: "push" = leaning into a wall, crate or squadmate stops the
# view at the surface (only the part that goes in; sliding along it stays 1:1),
# "off" = the view goes through. Menu: Basic > Head in walls.
headcollision push
# Room-scale: when you step more than 15 cm, Walker walks there too (with the
# game's collisions), so cover and enemy fire follow you.
roomscale on
# Eye height: "auto" = your real head height above the floor, taken when you
# put the headset on or recenter (it never moves by itself while playing; put
# on sitting or bent and then standing taller for 3 s, it is taken again once,
# under a blink), "height 1.72" = a fixed standing height in
# metres above the floor (hold both sticks for 3 s while standing tall to set
# and save it), "fixed" = Walker's eye height. Your eyes are never below
# Walker's eye height with your head straight (below it you would see his
# collar under your chin).
height auto
# Seated play: "auto" = detected from your head height 3 s after you put the
# headset on or recenter (below 1.35 m, or 30 cm below your saved standing
# height = sitting; a message tells you when it changes; detected sitting and
# then standing up for 3 s, it is measured again, and sitting back down for
# 3 s after that measures again too), "on" / "off" force
# it. Sitting, your eyes go to Walker's eye height plus your real head
# movement, and crouching for real is off (use the crouch button).
# Menu: Basic > Seated play.
seated auto
# Seated auto tuning: head height in metres below which you count as sitting.
seatedbelow 1.35
# Seated auto tuning: detected sitting, how far (m) above your seated head and
# for how many seconds you must stand before it measures again.
seatedstand 0.30 3
# Crouch view: "auto" = the game's crouch button (or a scripted crouch, or low
# cover when seated) lowers your view smoothly to Walker's crouch in crouchtime
# seconds; crouching for real moves only your own head (never twice). "real" =
# only your real head moves the view; "game" = the view drops with Walker like
# in the game. Menu: Basic > Crouch view.
crouchview auto
# Seconds the view takes to go down or up with the crouch button (0 = at once,
# behind a short fade).
crouchtime 0.35
# Crouch for real (30 cm below your standing height) and Walker crouches too,
# like the crouch button (low passages included); stand up and he stands.
# Not while seated.
physicalcrouch on

# ---- Aiming and hands ----------------------------------------------------------
# "hand" = you aim with the right controller (recommended in VR);
# "body" = the gun follows the stick, the head only looks around;
# "view" = shots go to the centre of your view.
aim hand
# Controller hold: "normal" = bare controllers, the gun points where the
# controller points (like the menu laser), tilted by gunangle; "gunstock" =
# controllers on a stock, tilted by stockangle (B + Y held 1 s measures it).
# Menu: Basic > Controller hold; Basic > Gun angle follows the hold.
holdmode normal
# Gun angle (normal hold): tilt of the gun in degrees above where the controller
# points (0 = along the menu laser, + = barrel up). Menu: Basic > Gun angle.
gunangle 0
# Stock angle (gunstock hold), same meaning; B + Y held 1 s measures it: aim the
# stock at something far away, look at it through the sights in the middle of
# your view and hold B + Y together for 1 second. (Normal hold: set gunangle;
# B + Y there is only right if you point the controller at the target like a
# real pistol, not by lining up the drawn gun, which already has gunangle.)
stockangle 0
# Gun yaw in degrees: + turns the gun outward, - inward, for controllers whose
# grip points to the side of where they point (e.g. Quest 3 Touch Plus).
gunyaw 0
# Two hands (normal hold): put your left hand on the barrel of the drawn gun
# and close the grip, or just keep it there a moment: the gun turns about your
# right palm so the barrel passes through your left hand, and the drawn left
# hand holds the gun (two-handed spread and vibration). Open the grip or move
# the hand away to let go (after moving away with the grip closed, open and
# close it again to grab). twohandgrip: cm from the barrel to take the gun.
# Once held, the left hand steers fully until it has moved twohandgrip cm off
# the place where it took the gun (counted at the drawn grip, as an angle
# about the right hand: the same anywhere along the barrel), and hands the gun
# back to the right hand gradually, all of it at twohandrelease. Turning or
# rolling the right wrist never counts; only the hands far apart (about twice
# that angle) do. twohanddwell: seconds the hand rests there without the grip.
twohandgrip 8
twohandrelease 15
twohanddwell 0.15
# Two-hand smoothing in Hz: lower = steadier, higher = less lag (0.2-10).
twohandsmooth 1
# Shift (cm forward, right, up) of the barrel grip measured from the drawn gun,
# if your left hand sits elsewhere on the barrel.
twohandguardfwd 0
twohandguardright 0
twohandguardup 0
# Gunstock hold with two hands: the gun follows the stock only. B + Y also
# saves where the left controller sits on the stock (none = not saved yet: the
# barrel test above decides when the left hand holds the gun); the left hand
# counts as on the stock within stocktol cm and stocktoldeg degrees of that place.
stockmount none
stocktol 6
stocktoldeg 25
# Weapon spread: the game's own cone (hip fire, automatic fire, per weapon)
# moved onto the barrel. on = as in the game (1), off = every shot exactly
# where the barrel points (0), or a scale 0..2. The cone is also scaled by
# your stance: sights at the eye 0.1x, two hands 0.5x; a long gun held in one
# hand 1.5x. Optional factors after the value: "spread on 1 0.1 0.5 1.5" =
# scale, sights at the eye, two hands, long gun in one hand.
spread on 1 0.1 0.5 1.5
# Aim aids: "marker on" (default) = green marker where the barrel points
# ("marker off" to use only the weapon's own sights), "laser on" = visible
# beam from the barrel to the point of impact.
marker on
laser off
# armoffset <forward> <right> <up>: wrist relative to the controller (cm).
# armrot <pitch> <yaw> <roll>: gun rotation relative to the controller (deg).
armoffset 0 0 0
armrot 0 0 0
# How much Walker's arms may stretch to reach the controllers (1 = none).
armstretch 1.25
# gunoffset <forward> <right> <up>: gun relative to the hand (cm). Per weapon:
# "gunoffsetclass YWeapon_RPG 0 0 -3" (added to gunoffset).
gunoffset 0 0 0
# First-person body: "full" = Walker stays opaque (the game fades him when the
# camera is close), his head is hidden, his eyes are on yours and his body hangs
# from your neck: turning or bending your head does not move it, leaning does.
# "arms" = only his arms, hands and gun are drawn (torso and legs hidden; hits
# and physics still use the whole body). Menu: Basic > Walker's body.
fpbody full
# Neck model for the body: your eyes are this many cm in front of and above
# the point your head turns around (forward, up).
neckmodel 8 13
# Walker's neck under his hidden head, drawn only, 0-1 (1 = whole neck and
# scarf, closed on top; 0 = neck pulled into the collar, the scarf stretches).
necksize 1
# Looking down, Walker's body moves back along your gaze until a ring of this
# radius (game units) around his neck is out of view (tall players).
neckring 4
# Walker's gun arm may stay this many game units short of its full stretch
# before his body moves forward with your hand (0-10).
reachslack 2
# Turning your head more than this many degrees turns Walker's body with you,
# so forward on the stick is where you look. 0 = only the stick turns him.
turnwithhead 45
# When your head has stayed still (left/right) for this many seconds, Walker's
# body turns slowly back under it, so looking down after a glance to the side
# shows your chest, not his shoulder pad. The view never moves. 0 = off.
# Needs turnwithhead above 0. Only with "aim hand" and tracked controllers
# (with "aim body" or "aim view" it stays off). It stops while you aim (two
# hands, gun at your eye, trigger in the last second) and near a wall or low
# cover in front of your eyes (the view's pull back from walls would move).
bodyalign 0.4
# Top speed of that turn, degrees per second (5-90).
bodyalignspeed 40
# Left stick moves where you look ("body" = where Walker's body points,
# "hand" = where the left controller points). In cover it always moves along
# the cover.
movedir head
# Smooth turning speed with the right stick, degrees per second (0 = the
# game's own turning, with its acceleration).
turnspeed 150
# Fade from black on cuts, teleports, checkpoints and when the camera leaves
# Walker (death): no hard cuts. "snapfade" = short blink on snap turns.
fades on
snapfade on
# Left-handed: "hand left" moves the gun, trigger and gun buttons to the left
# controller and Walker holds the gun in his left hand (arms not crossed).
hand right
# Wrist HUD: ammo (magazine / reserve), weapon and health on the support-hand
# wrist, like a watch. Optional width in metres: "wristhud on 0.09".
wristhud on
# Distance between the eyes: "auto" reads it from the headset, "fixed" uses
# the value of "stereo".
ipd auto
# Head pose prediction: the view is drawn with the pose the head will have
# when the image reaches the eyes. "auto" measures that delay on your PC and
# headset (head sample -> submit -> photons, as reported by the runtime); a
# number = next vsync + that many extra frames (at most 4); "off" = current
# pose. The controllers are never predicted by this (only the "handpredict"
# command, which is not in this file, does that).
predict auto
# SteamVR only (Steam Link): the frame opened by the headset wait is shown one
# vsync later than "next vsync" when the wait returns early ("running start").
# "auto" = off until the POSEAGE log line (drawn pose vs SteamVR's own frame
# pose) shows one frame missing twice in a row; "on" = always; "off" = never.
predictframe auto
# Head prediction is capped at this many milliseconds.
predictmax 150
# Experimental, off until tested on more headsets: send each frame with the
# head pose it was drawn with, so the headset's reprojection corrects the
# prediction error. With OpenXR (e.g. Virtual Desktop) the view is drawn wider
# per side for it (xroverscan); never used in the scope.
submitpose off
# OpenXR with submitpose on: degrees drawn beyond the headset's field of view on
# each side, so reprojection shows image instead of black edges (0-5).
xroverscan 1.5
# Cover: lean out with your body (stand up 12 cm or lean 18 cm sideways) to pop
# out and aim, like holding the left trigger.
coverpeek on
# Cover: when Walker leans out around the edge to aim, your view, hands and gun
# go with him, so you see and shoot past the wall without walking out of cover.
coverlean on
# Mounted guns and the helicopter minigun aim with your controllers.
# "turretaim stick" = the game's behaviour.
turretaim hand
# Turret grip (menu: Basic > Turret grip): "normal" = both hands on the handles
# (ground turrets: the gun pivots in front of your hands, see turretpivot;
# helicopter minigun: both grips held, turn them like handlebars, see
# turretbarmin); one hand alone also aims, and on a turret the grips send no
# grenade / squad order. "gunstock" = aim along your stock like a rifle;
# "auto" = follows Controller hold (holdmode).
turretgrip auto
# The turret is not pushed past its mount's limits (below); one short buzz on
# both hands at the limit. "off" = no limits from the mod.
turretlimits on
# Mounted guns on the ground: limits in degrees from the mount, right, left, up,
# down (the game's camera values; not measured on a real gun yet).
turretgroundright 45
turretgroundleft 55
turretgroundup 21
turretgrounddown 23
# Helicopter minigun: limits in degrees from the mount, right, left, up, down
# (measured in the prologue).
turretflightright 50
turretflightleft 65
turretflightup 18
turretflightdown 25
# Ground turrets, Turret grip normal: the gun pivots this many cm in front of
# your hands, like a real mounted gun (both hands tracked, palms 3-90 cm apart,
# no grips needed): move your hands left and the barrel turns right, lower
# them and it rises. Only where your hands are counts, not how your wrists
# turn. Shorter = more turn per cm (10-80). Not the helicopter minigun.
turretpivot 35
# Handlebars (Turret grip normal, helicopter minigun only): with both grips
# held, the palms turretbarmin-turretbarmax cm apart take the handles (held
# from 5 cm closer to 10 cm further), side by side within turretbaralign
# degrees (held +15) and no steeper than turretbarslope degrees (held +10).
# The minigun turns with the line between your palms and tilts with the
# controllers.
turretbarmin 25
turretbarmax 90
turretbaralign 35
turretbarslope 40
# Handlebars: seconds to pass between one-hand aim and the handlebars (0-0.5).
turretbarblend 0.1
# Handlebar smoothing (1-euro filter): Hz when still (lower = steadier) and how
# fast it opens up when the handles move (beta).
turretbarsmooth 1
turretbarbeta 4
# Bring the gun up to your eye to aim down the sights: the green dot hides and
# the game's aim mode (left trigger) is used.
ads on
# Scripted scenes that keep the camera on Walker stay in 3D ("screen" = show
# them on the virtual cinema screen instead). Videos always use the screen.
cinemawalker 3d
# Short notices in the headset (recentered, update installed, VR output
# paused, haptics lost): "toasts off" hides them.
toasts on
# Controller hints in the headset during the first three play sessions
# ("auto"; "on" = every session, "off" = never). The object hints (an object
# near the left hand, the first object held, an enemy within reach with an
# object in hand, an enemy grenade, a dropped gun, an explosive bottle) come
# once each the first time the situation happens: once per profile with
# "auto", once per session with "on", never with "off".
hints auto
# Settings menu in the headset at every start (on the game's main menu):
# point a controller at it; PLAY closes it. "vrmenu off" = never by itself.
vrmenu on
# Sniper scopes: the zoomed image is shown as a lens in the middle of the view,
# along the barrel (the reticle is where the bullets go), black around it.
scopezoom on

# ---- Controllers -------------------------------------------------------------
# "actions" = SteamVR Input: default bindings for Quest/Rift (Touch), Valve
# Index, Vive and Windows Mixed Reality controllers, changeable in SteamVR
# (Settings > Controllers > Manage controller bindings > Spec Ops: The Line).
# "legacy" = the old input API (Touch layout only).
vrinput actions
# Every controller is aimed like a Touch controller (from the pointing
# direction of its SteamVR model). "raw" = the controller's own raw pose.
controllerpose auto

# ---- Gestures ------------------------------------------------------------------
# grenade = quick forward throw with the left hand (chest height or above);
# melee   = quick forward punch with the left hand at chest height (B);
# reload  = see "reload" below;
# cover   = duck quickly next to cover;
# weapon  = right hand over your right shoulder + grip = next weapon.
gesture grenade on
gesture melee on
gesture reload on
gesture cover on
gesture weapon on
# Jab / overhead strike with the gun hand = melee (off: fast gun moves triggered it).
gesture gunmelee off
# Honest reload: with the magazine out of the gun (physical reload) the trigger
# does not fire. "honestreload off" to fire anyway.
honestreload on
# Reload: "physical" = hold the left grip on the magazine (under the gun) and
# pull it out, grip at your belt to take a new one, push it into the gun;
# "simple" = left hand on the magazine, then pull down. X always reloads.
reload simple
# "manualaction on": after a physical reload the gun must be racked before it
# fires (grip the receiver just ahead of your gun hand with the left hand and
# pull back 8 cm). Off = the game's reload is complete when the magazine is in.
manualaction off
# Physical interactions: when a hand is within 25 cm of a rope, zipline or
# turret grab point the controller ticks; closing the grip there uses it
# (sends A). "grabuse off" keeps the prompt button only.
grabuse on
# Objects: close the grip with a hand next to a physics object (signs, hats,
# bottles...) to pick it up; it follows your hand and bumps into walls; open
# the grip to drop it, or throw it (speed of your hand x throwboost).
# grabzone = how close the hand must be (cm); grabright = the gun hand too.
grabprops on
# Gravity gloves (like Half-Life: Alyx): point the left hand at an object up to
# 8 m away (light tick), close the grip (stronger tick), flick the hand towards
# you or up: it flies into your hand (keep the grip closed to catch it, or close
# it again while it floats in front of your hand for 0.6 s). Guns an enemy
# dropped too (with weaponpickup on; not while the left hand holds the gun or
# reloads): caught, the gun is in your left hand as if you had picked it up,
# or you take its ammo if you carry the same gun and your ammo is not full.
# Needs grabprops.
gravitygloves on
# Glowing corners around what you point at or can reach (an object, a dropped
# gun, a body to drag; gold = locked).
grabhighlight on
# Throw strength: what you throw (objects, grenades thrown back) leaves at your
# hand's speed times this (0.5-3).
throwboost 1.3
# Throws: peak = objects leave at the fastest speed of your throw (last 0.1 s),
# spin with your wrist, and heavy ones lob; a slow release (under ~1-2 m/s)
# just puts the object down; classic = average hand speed (older).
throwmode peak
# Throws (peak): the most energy one throw can have, in joules (85: a 33 kg
# barrel flies at 2.3 m/s at most, a 5 kg radio at 5.8, a bottle at 10).
# 0 = no limit.
throwenergy 85
# Throws (peak): a release whose fastest hand speed (relative to your body) is
# under throwplace m/s puts the object down with your hand's speed as it
# opens; from throwfull m/s up it is a throw at the peak speed; in between a
# smooth mix.
throwplace 1
throwfull 2
# Throws (peak): a single tracking glitch (a controller snapping back into
# view) is ignored when it is more than this many m/s (or 20%) off the samples
# around it. 0 = never ignore.
throwglitch 0.5
# Impact haptics: the controller pulses when what you hold hits something or
# your empty hand slaps it, scaled by how hard (full); low = half strength;
# off = only the fixed pulses (grab, knock) of before. The gun hand, and the
# left hand while it holds the gun or reloads, keep the fixed pulses.
impacthaptics full
# Impact haptics: speed (m/s) a contact must take from what you hold, or from
# your empty hand, to pulse. Lower = gentler touches pulse too.
hapticdv 0.8
# Impact haptics: impulse (N s) for a full-strength pulse (strength = 0.2 +
# impulse / this). Impulse = felt mass x speed lost.
hapticfull 5
# Impact haptics: at most one impact pulse per hand every this many ms.
hapticrefractory 80
# Impact haptics: a contact must end for this many ms before the next one can
# pulse (pressing against a wall does not repeat).
hapticrearm 40
# Impact haptics: a contact adds up the speed it takes for this many ms (a
# corner touching and turning the object).
hapticwindow 50
# Impact haptics: the approach speed is read over this many ms before the
# contact (at least two frames).
hapticapproach 25
# Impact haptics: mass of your hand in kg; a held object (or one you knock or
# catch) is felt with the reduced mass of object and hand (8 kg radio: 3.1 kg).
haptichandkg 5
# Impact haptics: mass in kg of the empty hand that slaps (2: 0.8 m/s gives
# half strength, 2 m/s full).
hapticslapkg 2
# Impact haptics: the empty hand must move faster than this (m/s) to slap.
hapticslapspeed 0.5
# Objects as weapons: objects you throw (or swing in your hand) that hit an
# enemy, a glass pane, a sand window or a crate count as hits ("PROPS: hit"
# in specopsvr.log). Off = they only bounce off.
propcombat on
# Thrown objects hurt enemies (needs propcombat): light objects a little
# (melee damage, never a kill); heavy objects, or a hit on the head, make the
# enemy stagger or fall like Walker's melee. Squad mates and civilians: never.
# Off = thrown objects only bounce off.
propthrowdamage on
# Swing objects at enemies (needs propcombat): an object you hold that hits an
# enemy at 2.5 m/s or more counts as a melee hit. The speed is the swing,
# measured from Walker's body: walking into an enemy with the object held still
# is not a hit. From 3 m/s (or on the head)
# with anything heavier than a can, the enemy staggers or falls like after
# Walker's own melee (B then finishes him); slower or lighter, a small hit.
# Melee damage never kills; head hits count double (at most Walker's melee).
# At most one hit every 0.6 s per enemy, none during Walker's own melee. A
# bottle or a glass breaks on the enemy. Off = held objects only bump them.
propmelee on
# Objects break glass (needs propcombat): an object you throw or swing that
# hits a glass pane, a breakable crate or a window holding back sand damages
# it through the game's own damage (more for heavier and faster objects): a
# thrown bottle cracks the windows of the sand-filled bus of chapter 1, a
# thrown radio smashes them and the sand buries whoever is below. Off = objects
# only bounce off (or fly through panes that have no physics).
propglass on
# Objects stop bullets: an object you hold in your free hand (a suitcase, a
# box, a radio) stops enemy bullets that hit it. Each hit pushes it and you
# feel it; after a few hits it flies out of your hand (plates and books 2,
# suitcases and radios about 6, metal boxes and sandbags 15; a sniper or a
# shotgun wears it faster). Off = enemy bullets go through what you hold.
propshield on
# Explosive bottles: the propane and diving bottles placed in the levels can be
# picked up (and pulled with the gravity gloves) and thrown. A bottle you carry
# explodes where it is, with the game's own blast and damage, when a bullet
# hits it hard enough (yours or an enemy's: like the bottles in the levels, a
# strong hit at once, a rifle in two) or when it lands very hard (dropped from
# about 3 m up, e.g. off a roof onto enemies; putting it down or tossing it
# never sets it off). The blast hurts you too: step back 5 m before you shoot
# it. Off = they stay in place.
propexplosive on
# Fake grenades: a small object you throw (a can, a bottle, a rock: yes; a
# radio: too big) that lands within 3 m of enemies makes them think it is a
# grenade. The nearest one shouts "grenade!" and their AI gets the same warning
# the game sends for a real frag grenade. Once every 10 s per group of enemies.
# An object that hits or touches an enemy does not count, and neither does one
# that lands with Adams or Lugo about as close to it as the enemy (they would
# take it for a grenade too). Off = thrown objects are just objects.
fakegrenade on
# Objects make noise (EXPERIMENTAL, not verified): an object you throw, drop or
# knock over that lands hard (from above about 3 m/s), or a bottle you smash in
# your hand, sends the enemies' AI the game's own fist-fight noise at the impact
# point, within 3-15 m depending on how heavy the object is and how hard it
# lands; breaking glass is louder. At most one noise per second. In firefight
# tests it made no clear difference (the enemies already knew where you were).
# It was not tested on enemies not fighting yet, and the game records the noise
# as made by you, so it may draw them to you rather than to the object, or wake
# enemies before the level means them to fight. Off by default.
propnoise off
# Throw back grenades: an enemy grenade that has come to rest on the ground
# within 8 m of you gets red corners (thicker when your left hand can reach it;
# shown with grabhighlight on). Close your left hand on it to pick it up, then
# throw it back: it leaves at your hand's speed times throwboost (at most 26 m/s).
# The fuse keeps burning (enemy frag grenades explode 4 s after the throw), so a
# grenade held too long explodes in your hand and kills you. Thrown back it is
# your grenade: the enemies it kills count as yours. Grenades still in the air
# cannot be caught. A grenade with under 1 s of fuse left (stun and phosphor
# grenades always) gets no corners and cannot be picked up. Adams' and Lugo's
# grenades are left alone. Needs grabprops. Off = enemy grenades cannot be
# picked up.
grenadeback on
# Pick up enemy weapons: close your left (support) hand on a gun an enemy dropped
# to pick it up; it stays in your hand with physics. Bring it to your gun hand
# (within ~15 cm) and the gun hand takes it, with its ammo: if you already carry
# two guns, the one in your gun hand drops to the ground. Touching (or handing
# over) a gun of a type you already carry takes its ammo instead; with your
# ammo full you pick it up. A gun in your hand never vanishes (the game removes
# dropped guns after a while, but not while you hold one). The gravity gloves
# pull dropped guns too (see gravitygloves). Off = press A next to it, as in the
# game (also with grabprops off, and for the right hand), and the gloves leave
# guns alone.
weaponpickup on
# Drag bodies: close your left hand on a dead enemy's arm, leg or body to grab
# it and drag it along the ground, say to clear a doorway; a fast swing (over
# 1 m/s) of your free hand also shoves a body. A body is heavy (your hand's pull
# follows Object weight: 200 N with full, 400 with light, 800 with off) and lags
# when you pull hard, but the pull grows while it does not come (up to 4x), so
# it always moves; yanked more than ~40 cm away it slips out of your hand. Only
# dead enemies: never squad mates, story characters or civilians, never living
# ones or enemies still dying on the ground. A body
# the game has already laid to rest becomes physical again when you touch it,
# and when it stops the game lays it to rest again (with a new blood pool where
# it lies). Needs grabprops. Off = bodies stay where they fall.
corpsedrag on
# Disarm enemies: hit an enemy's gun hard (a fast slap with your free hand, a
# swung object, or a thrown one) and he staggers like after your melee; harder
# (a slap at ~4 m/s, a bottle swung at 2.5 m/s, a radio thrown) and the gun
# falls out of his hands, the game's own drop: it becomes a gun on the ground
# you can pick up. A disarmed enemy stops shooting; once he is back on his feet
# (5-10 s) he grabs his gun again if it is still within 3 m and you did not
# take it. Needs propcombat.
disarm on
# Grab objects: how close (cm) the hand must be to what it takes (2-30).
grabzone 8
# Grab objects with the gun hand too (off = only the left hand).
grabright off
# Weight of objects: kg per unit of engine mass (40: bottle ~1.7 kg, radio ~8,
# fuel barrel ~33). Over 15 kg they follow the hand more slowly (never under 5 m/s).
masskg 40
# Object weight in the free hand: heavy objects lag, sag and turn slowly (full)
# or a little (light); off = no weight. Nothing becomes too heavy to lift.
objectweight light
# Weight (full; light doubles it): the hand's strongest pull on an object, in
# newtons, gravity included. Heavier objects still rise, slowly.
weightforce 200
# Weight (full; light doubles it): the hand's strongest twist, in N m.
weighttorque 12.5
# Weight (full; light doubles it): the slowest a held object can start turning,
# in rad/s2, however big or heavy it is (it never refuses to turn).
weightturn 3
# Weight sag (full; light halves it): grip stiffness in N/m, 2000 = 0.5 cm per
# kg, at most 6 cm.
weightsag 2000
# Weight droop (full; light halves it): N m per radian for objects held away
# from their centre, at most 20 degrees.
weightdroop 60
# Weight: an object stuck among others comes free if you keep pulling; the pull
# doubles every this many ms (0 = off: it slips out of the hand instead).
weightbreak 30
# Weight: an object stuck while your still hand holds it is re-gripped where it
# is after this many seconds (as if your hand closed there; it slides back onto
# your palm when the hand moves). 0 = off: the stuck object is yanked instead,
# and only weightwedge lets go of it.
weightregrip 0.2
# Weight: let go of a stuck object your palm no longer touches after this many
# seconds, at 16 cm from the palm (sooner farther away). 0 = never: it slips
# out only when your hand is pulled far away.
weightwedge 1
# Analog grip (needs Object weight): squeeze harder for more control. A loose
# grip (just past the grab point) gives your hand 40% of its pull and twist:
# objects trail further, tilt a little more and turn back slowly; a full
# squeeze holds them tight. Nothing becomes too heavy to lift. Controllers
# with an on/off grip see no change.
analoggrip off
# Analog grip: share of the hand's pull and twist at the loosest grip (0.4 =
# 40%), rising in a straight line to all of it at a full squeeze.
analoggripmin 0.4
# Analog grip: grip values (0-1) for the loosest and the firmest hold. 0.9,
# not 1: a normal full squeeze already gives full control, also on worn or
# force-sensing grips that never quite reach 1.
analoggriploose 0.6
analoggripfirm 0.9
# Analog grip: at the loosest grip the object turns back to the hand's angle
# this much slower (0.5 = half as fast).
analoggripturn 0.5
# Analog grip: at the loosest grip an object held off-centre hangs this many
# times lower (2 = twice the droop), never past the weight droop limit.
analoggripdroop 2
# Analog grip: a looser grip takes effect this many ms after the last firmer
# value (a trembling grip does not weaken the hold)...
analoggriphold 100
# ...and then fades in with this time constant (ms), so nothing jumps.
analoggripease 80
# Analog grip: a firmer grip takes over with this time constant (ms): fast,
# but without a jump in pull, twist or tilt.
analoggriprise 25
# Analog grip: a throw uses your firmest grip of the last this many ms, so
# opening the hand while you throw, even slowly, does not weaken it (0 = the
# grip at the moment of release).
analoggripthrow 300
# Analog grip: however loose the grip, the hand still pulls up with at least
# this many times gravity (or what a firm grip gives, if less).
analoggripfloor 1.3
# Solid hands: your free hand is drawn where physics puts it, not on the
# controller. held = on what you hold, with object weight on (it lags and sags
# with heavy objects and stays on an object you press into a crate), and on
# door handles; full = your empty hand also stops on objects that have physics
# (a crate lid; most walls and floors of the levels do not stop it). off =
# always on the controller. The gun hand and aiming never change.
solidhands held
# Solid hands: offsets under this many cm are softened (not drawn below ~1 cm).
solidhandsdead 2.5
# Solid hands: the same for the hand's turn, in degrees.
solidhandsturn 8
# Solid hands: the drawn hand is at most this many cm from your controller.
solidhandscap 25
# Solid hands: the drawn hand turns at most this many degrees from your controller.
solidhandscapturn 45
# Solid hands: ms for the drawn hand to move onto an object (offset growing).
solidhandsin 40
# Solid hands: ms for the drawn hand to return to your controller.
solidhandsout 100
# Where the magazine is: cm forward along the barrel and cm below the right
# controller.
magwell 4 10

# ---- Comfort -------------------------------------------------------------------
# Right stick turning: 0 = smooth; e.g. 30 = snap turns of 30 degrees.
snapturn 0
# Right stick up/down to look up/down (in VR your head does this).
stickpitch off
# Comfort vignette while moving (0 = off, 0.5 = medium, 1 = strong).
vignette 0
# Cutscenes, menus and loading screens on a big fixed virtual screen.
cinema on
# Screen width and distance in metres.
cinemasize 3.2 2.6

# ---- Performance ---------------------------------------------------------------
# Game resolution = what the VR runtime recommends for one eye (with SteamVR it
# follows its resolution slider; changed on the fly when it differs by more
# than 4%).
# "resolution window" = keep the window size from ResX/ResY.
resolution auto
# Dynamic resolution: when the GPU gets close to the headset frame time, the
# scene is drawn with fewer pixels (down to "dynres min" percent, 40-100) and
# the game stretches it back over the whole view, instead of dropping to half
# frame rate; it goes back up when there is headroom. "dynres off".
dynres on
dynres min 65
# Dynamic resolution tuning, as fractions of the headset frame time (GPU p90
# over 2 s): step down above dynresdown, or above dynresslow for 2 s; step up
# (5 points) after 5 s below dynresup. Each level is kept at least dynresdwell
# seconds (half that above dynresdown); a level that proved too heavy is
# blocked for dynresbackoff seconds, doubled at every new failure (up to 16
# times as long).
dynresdown 1.0
dynresslow 0.92
dynresup 0.65
dynresdwell 4
dynresbackoff 20
# VR graphics preset: screen-space ambient occlusion and filtered distortion
# off (15-17% of GPU time each, and their noise differs between the eyes).
# Applied once, when the 3D view first starts.
vrpreset on
# One frame of lag between the game and render threads, as in the game.
# "threadlag off" lowers latency by ~10 ms but costs a lot of frame rate in
# heavy fights (48-53 fps instead of 75-86 in chapter 1). It is applied with
# vrpreset, so "threadlag off" needs vrpreset on.
threadlag on
# Quest over Link: Meta's ASW, once engaged, locks the game at half rate
# (36 fps at 72 Hz) even with plenty of headroom. "off" = turned off through
# the Oculus Debug Tool when VR starts and set back to Auto when the game
# closes; "keep" = leave it alone.
linkasw off
# Index, Vive, Pimax, WMR: SteamVR Motion Smoothing forced off for this game
# only (SteamVR > Settings > Video > Per-application). "keep" = leave it.
# Virtual Desktop: its Synchronous Spacewarp can do the same; the mod cannot
# change it: set it to Disabled in the Virtual Desktop menu in the headset
# (Streaming tab).
motionsmoothing off
# Send each frame to the headset in the same tick it was drawn when the GPU
# has headroom (about one frame less latency on hands and gun).
lowlatency on
# Pixels sent to the headset per eye (1 = full resolution; 0.8 = smoother).
outputscale 1
# The desktop window is refreshed every N frames (preview only).
monitor 1
# D3D9Ex device with GPU-to-GPU copies (much faster). If the game misbehaves:
# gpushare off. Read when the game starts (a change takes effect at the next
# start).
gpushare on

# ---- External haptics -----------------------------------------------------------
# ProTubeVR ForceTube / ProVolver: install the free ProTubeVR Companion App
# (Steam) and pair the devices in Windows; recoil on every shot, scaled by
# weapon. The first device found is the gun hand, a second one the support
# hand: "protube swap" if they come out the wrong way round.
protube on
# bHaptics vest and arm sleeves: start the bHaptics Player; recoil on the arms,
# hits taken on the vest, grenade / melee / reload on the left arm.
bhaptics on

# ---- Updates -------------------------------------------------------------------
# The mod checks GitHub for a newer version at every start-up and installs it
# for the next launch (always on).
# "stable" = tested releases only; "beta" = also test builds (pre-releases).
updatechannel stable

# Settings format version (updated automatically).
configversion 12
