# SpecOpsVR - configuration (read when the game starts).
# One command per line; lines starting with # are comments.
# The same commands can be sent at runtime through specopsvr_cmd.txt.

# ---- Stereo and view ---------------------------------------------------------
# Half the distance between the eyes in Unreal units (~2 cm per unit):
# 1.6 = ~6.4 cm. "sync" = synchronous stereo (recommended), "afr" = alternate.
stereo 1.6 sync
# First person: eye height above the character centre and forward offset
# (Unreal units). "fp off" = third person.
fp 40 15
# Near clipping plane in first person. With fpbody Walker's head is hidden by
# the skeleton, so a low value keeps arms and weapon near the eyes visible.
# Original game = 10 (use 18 with fpbody off).
near 3
# Field of view: "auto" = from the headset, or degrees, e.g. "fov 100".
fov auto
# Head tracking: hmd = headset, off = disabled.
mode hmd
# Motion blur and depth of field: off is recommended in VR.
postfx off
# Full-screen view (no 16:9 bars): full | game
viewport full
# HUD and menus: scale towards the centre (1 = original) and apparent distance
# in Unreal units (0 = infinity).
hud 0.6 150

# ---- Head movement (6DOF) ----------------------------------------------------
# Head position (lean, crouch, side step) and roll move the view.
6dof on
# Unreal units per metre (50 = 1:1 with the game world).
posscale 50
# If the horizon turns the wrong way when tilting your head: rollsign -1
rollsign 1
# Leaning into walls or the floor stops the view instead of clipping through.
headcollision on
# Walker's body follows your horizontal head movement.
bodyfollow on

# ---- Aiming and hands ----------------------------------------------------------
# "hand" = you aim with the right controller (recommended in VR);
# "body" = the gun follows the stick, the head only looks around;
# "view" = shots go to the centre of your view.
aim hand
# Pitch correction of the controller ray (degrees), only for "aim hand".
aimpitch 0
# Shots leave the visible gun barrel and land where it points (green marker).
muzzleaim on
# Disable the gamepad aim assist (aim friction / snap-on) while aiming by hand.
aimassist off
# Weapon spread as in the game (on = shots scatter around the barrel
# direction, more during automatic fire; off = every shot goes exactly where
# the barrel points).
spread on
# Green marker where the barrel points.
marker on
# Walker's own arms follow the controllers (IK on his skeleton): hands on the
# controllers, the gun stays in the right hand. "arms off" = only the gun
# follows the controller.
arms on
# armoffset <forward> <right> <up>: wrist relative to the controller (cm).
# armrot <pitch> <yaw> <roll>: gun rotation relative to the controller (deg).
armoffset 0 0 0
armrot 0 0 0
# Used with "arms off": the gun model follows the right controller.
gun on
gunoffset 0 0 0
# Per-weapon grip offset (cm: forward right up), added to gunoffset.
# Example: gunoffsetclass YWeapon_RPG 0 0 -3
# Two-handed aiming: put your left hand on the barrel (within 8 cm of the
# line of the gun, 12-70 cm in front of the right hand) and the gun points
# from the right hand to the left one.
twohand on
# First-person body: Walker stays opaque (the game fades him when the camera
# is close), his head is hidden and the body is moved back by "bodyback"
# units so you see chest and legs when looking down.
fpbody on
bodyback 14
# Sniper scopes zoom in like in the game.
scopezoom on

# ---- Gestures ------------------------------------------------------------------
# grenade = quick forward throw with the left hand (chest height or above);
# reload  = left hand on the magazine (below the right hand), then pull down;
# cover   = duck quickly next to cover;
# weapon  = right hand over your right shoulder + grip = next weapon.
gesture grenade on
gesture reload on
gesture cover on
gesture weapon on

# ---- Comfort -------------------------------------------------------------------
# Right stick turning: 0 = smooth; e.g. 30 = snap turns of 30 degrees.
snapturn 0
# Right stick up/down to look up/down (in VR your head does this).
stickpitch off
# Comfort vignette while moving (0 = off, 0.5 = medium, 1 = strong).
vignette 0
# Cutscenes, menus and loading screens on a big fixed virtual screen.
cinema on
# Screen width and distance in metres.
cinemasize 3.2 2.6

# ---- Performance ---------------------------------------------------------------
# Pixels sent to the headset per eye (1 = full resolution; 0.8 = smoother).
outputscale 1
# The desktop window is refreshed every N frames (preview only).
monitor 1
# D3D9Ex device with GPU-to-GPU copies (much faster). If the game misbehaves:
# gpushare off
gpushare on

# ---- Updates -------------------------------------------------------------------
# Check GitHub for a newer version at start-up and install it for the next
# launch. "autoupdate off" to disable.
autoupdate on
