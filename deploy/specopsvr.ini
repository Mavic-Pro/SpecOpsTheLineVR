# SpecOpsVR - configuration (read when the game starts).
# One command per line; lines starting with # are comments.
# The same commands can be sent at runtime through specopsvr_cmd.txt.

# ---- Stereo and view ---------------------------------------------------------
# Half the distance between the eyes in Unreal units (~2 cm per unit):
# 1.6 = ~6.4 cm. "sync" = synchronous stereo (recommended), "afr" = alternate.
stereo 1.6 sync
# First person: eye height above the character centre and forward offset
# (Unreal units). "fp off" = third person.
fp 40 15
# Near clipping plane in first person. With fpbody Walker's head is hidden by
# the skeleton, so a low value keeps arms and weapon near the eyes visible.
# Original game = 10 (use 18 with fpbody off).
near 3
# Field of view: "auto" = from the headset, or degrees, e.g. "fov 100".
fov auto
# Head tracking: hmd = headset, off = disabled.
mode hmd
# Motion blur and depth of field: off is recommended in VR.
postfx off
# Full-screen view (no 16:9 bars): full | game
viewport full
# HUD and menus: scale towards the centre (1 = original) and apparent distance
# in Unreal units (0 = infinity). Full-screen effects (blood at the edges when
# hurt, flashes) always cover the whole view.
hud 0.5 100

# ---- Head movement (6DOF) ----------------------------------------------------
# Head position (lean, crouch, side step) and roll move the view.
6dof on
# Unreal units per metre (50 = 1:1 with the game world).
posscale 50
# If the horizon turns the wrong way when tilting your head: rollsign -1
rollsign 1
# Leaning into walls or the floor stops the view instead of clipping through.
headcollision on
# Walker's body follows your horizontal head movement.
bodyfollow on
# Room-scale: when you step more than 15 cm, Walker walks there too (with the
# game's collisions), so cover and enemy fire follow you.
roomscale on
# Eye height: "auto" = your real standing height (the highest head position
# seen since the last recenter), "height 1.72" = a fixed standing height in
# metres above the floor (hold both sticks for 3 s while standing tall to set
# and save it), "fixed" = the game's fp value. "seated on" for seated play.
height auto
seated off
# When Walker crouches (cover) the view stays at your real head height and his
# body is raised to match: you hide by crouching yourself. "game" = the view
# drops with Walker like in the game.
crouchview real

# ---- Aiming and hands ----------------------------------------------------------
# "hand" = you aim with the right controller (recommended in VR);
# "body" = the gun follows the stick, the head only looks around;
# "view" = shots go to the centre of your view.
aim hand
# Pitch correction of the controller ray (degrees), only for "aim hand".
# Gunstock: aim the stock at something far away, looking at it through the
# sights in the middle of your view, and hold B + Y together for 1 second: the
# angle is measured and saved here.
aimpitch 0
# Shots leave the visible gun barrel and land where it points (green marker).
muzzleaim on
# Disable the gamepad aim assist (aim friction / snap-on) while aiming by hand.
aimassist off
# Weapon spread: the game's own cone (hip fire, automatic fire, per weapon)
# moved onto the barrel. on = as in the game (1), off = every shot exactly
# where the barrel points (0), or a scale 0..2. The cone is also reduced by
# your stance: two hands 0.6x, sights at the eye 0.5x; a long gun held in one
# hand 1.5x. Optional factors after the value: "spread on 1 0.1 0.5 1.5" =
# scale, sights at the eye, two hands, long gun in one hand.
spread on 1 0.1 0.5 1.5
# Aim aids: "marker on" = green marker where the barrel points (off by
# default: use the weapon's own sights), "laser on" = visible beam from the
# barrel to the point of impact.
marker off
laser off
# The game's own crosshair (fixed in the middle of your view). Hidden while
# aiming with the controller, where the green marker replaces it.
gamecrosshair off
# Walker's own arms follow the controllers (IK on his skeleton): hands on the
# controllers, the gun stays in the right hand. "arms off" = only the gun
# follows the controller.
arms on
# armoffset <forward> <right> <up>: wrist relative to the controller (cm).
# armrot <pitch> <yaw> <roll>: gun rotation relative to the controller (deg).
armoffset 0 0 0
armrot 0 0 0
# How much Walker's arms may stretch to reach the controllers (1 = none).
armstretch 1.25
# Used with "arms off": the gun model follows the right controller.
gun on
gunoffset 0 0 0
# Per-weapon grip offset (cm: forward right up), added to gunoffset.
# Example: gunoffsetclass YWeapon_RPG 0 0 -3
# Two-handed aiming: put your left hand on the barrel (within <cm> of the
# line of the gun sideways, 2/3 of that above or below it, 12-70 cm in
# front of the right hand) and the gun points
# from the right hand to the left one. The log says "AIM: two-handed grip"
# when it engages and how far the hand is when it does not. The third value
# smooths the hand-to-hand line in seconds (0.08; free hands shake, a
# gunstock does not: 0.02 for a stock).
twohand on 12 0.08
# Left hand on the gun: within <cm> of where the game holds the handguard the
# left hand grips the gun in the game's pose (fingers closed on it), whatever
# the angle of the controller (gunstocks). Pistols stay one-handed.
leftgrip on 20
# First-person body: Walker stays opaque (the game fades him when the camera
# is close) and his head is hidden. bodyback <units> <extra>: the body is moved
# back by <units> (negative = forward, under your head, so the arms reach the
# controllers) plus up to <extra> away from where you look when you look down
# or over your shoulder, so you see chest and legs instead of the inside of
# the collar.
fpbody on
bodyback -10 26
# Squad orders (hold the right grip): the target is the enemy along your gun
# barrel. "commandaim head" = the game's behaviour (centre of the view).
commandaim gun
# Turning your head more than this many degrees turns Walker's body with you,
# so forward on the stick is where you look. 0 = only the stick turns him.
turnwithhead 45
# Body direction: "head" = the body turns when you look more than
# turnwithhead degrees away; "hands" = the torso is estimated from head
# (0.5), the line between your hands (0.3) and the gun hand (0.2) with a
# 20 degree dead zone (experimental).
bodyfacing head
# Seconds to smooth eye-height changes (crouching into cover, popping up).
# 0 = instant.
eyesmooth 0.12
# Left stick moves where you look ("body" = where Walker's body points,
# "hand" = where the left controller points). In cover it always moves along
# the cover.
movedir head
# Smooth turning speed with the right stick, degrees per second (0 = the
# game's own turning, with its acceleration).
turnspeed 150
# Fade from black on cuts, teleports, checkpoints and when the camera leaves
# Walker (death): no hard cuts. "snapfade" = short blink on snap turns.
fades on
snapfade on
# With the headset on, the game does not pause when its window loses focus
# (clicking the Virtual Desktop desktop, a notification).
keepfocus on
# Left-handed: "hand left" swaps the controllers (gun, trigger and gun buttons
# on the left controller).
hand right
# Distance between the eyes: "auto" reads it from the headset, "fixed" uses
# the value of "stereo".
ipd auto
# "submitpose on" sends each frame with the head pose it was rendered with.
# Off is better in the headset (19/10, Quest 3 over Link): with it on, moving
# the head showed black bands at the edges and a warped, fisheye-like image.
submitpose off
# Head pose prediction: the view is drawn with the pose the head will have
# when the image reaches the eyes. "auto" measures that delay on your PC and
# headset (head sample -> SteamVR submit -> photons, as reported by the
# runtime); a number = next vsync + that many extra frames; "off" = current
# pose. The controllers are never predicted by this (see handpredict).
predict auto
# Controllers predicted this many milliseconds ahead (0 = off; 25 made the gun
# look doubled in the headset, 18/10). "auto" = as far ahead as the head
# (to try now that the gun no longer doubles when walking).
handpredict 0
# Cover: a turn the game gives Walker while he takes, holds or leaves cover is
# kept out of the view (the world does not spin around you). Turns outside
# cover (checkpoints, scripted scenes) are left alone.
coversnap on
# Cover: lean out with your body (stand up 12 cm or lean 18 cm sideways) to pop
# out and aim, like holding the left trigger.
coverpeek on
# Mounted guns and the helicopter minigun aim with your right controller.
# "turretaim stick" = the game's behaviour.
turretaim hand
# Bring the gun up to your eye to aim down the sights: the green dot hides and
# the game's aim mode (left trigger) is used.
ads on
# Scripted scenes that keep the camera on Walker stay in 3D ("screen" = show
# them on the virtual cinema screen instead). Videos always use the screen.
cinemawalker 3d
# When the cinema screen ends (scene, video, loading) the view is recentred
# under the black: you look where Walker looks and start from where you stand.
cinemaalign on
# Short notices in the headset (recentered, update installed, VR output
# paused, haptics lost): "toasts off" hides them.
toasts on
# Controller hints in the headset during the first three play sessions
# ("auto"; "on" = every session, "off" = never).
hints auto
# Settings menu in the headset at every start (on the game's main menu):
# point a controller at it; PLAY closes it. "vrmenu off" = never by itself.
vrmenu on
# Sniper scopes: the zoomed image is shown as a lens in the middle of the view,
# along the barrel (the reticle is where the bullets go), black around it.
scopezoom on

# ---- Controllers -------------------------------------------------------------
# "actions" = SteamVR Input: default bindings for Quest/Rift (Touch), Valve
# Index, Vive and Windows Mixed Reality controllers, changeable in SteamVR
# (Settings > Controllers > Manage controller bindings > Spec Ops: The Line).
# "legacy" = the old input API (Touch layout only).
vrinput actions
# Every controller is aimed like a Touch controller (from the pointing
# direction of its SteamVR model). "raw" = the controller's own raw pose.
controllerpose auto

# ---- Gestures ------------------------------------------------------------------
# grenade = quick forward throw with the left hand (chest height or above);
# melee   = quick forward punch with the left hand at chest height (B);
# reload  = see "reload" below;
# cover   = duck quickly next to cover;
# weapon  = right hand over your right shoulder + grip = next weapon.
gesture grenade on
gesture melee on
gesture reload on
gesture cover on
gesture weapon on
# Honest reload: with the magazine out of the gun (physical reload) the trigger
# does not fire. "honestreload off" to fire anyway.
honestreload on
# Executions: B near a downed enemy turns Walker toward it (the game only
# picks enemies in front of his body). "execassist off" to disable.
execassist on
# Reload: "physical" = hold the left grip on the magazine (under the gun) and
# pull it out, grip at your belt to take a new one, push it into the gun;
# "simple" = left hand on the magazine, then pull down. X always reloads.
reload physical
# "manualaction on": after a physical reload the gun must be racked before it
# fires (grip the receiver just ahead of your gun hand with the left hand and
# pull back 8 cm). Off = the game's reload is complete when the magazine is in.
manualaction off
# Physical interactions: when a hand is within 25 cm of a rope, zipline or
# turret grab point the controller ticks; closing the grip there uses it
# (sends A). "grabuse off" keeps the prompt button only.
grabuse on
# Where the magazine is: cm forward along the barrel and cm below the right
# controller.
magwell 4 10

# ---- Comfort -------------------------------------------------------------------
# Right stick turning: 0 = smooth; e.g. 30 = snap turns of 30 degrees.
snapturn 0
# Right stick up/down to look up/down (in VR your head does this).
stickpitch off
# Comfort vignette while moving (0 = off, 0.5 = medium, 1 = strong).
vignette 0
# Cutscenes, menus and loading screens on a big fixed virtual screen.
cinema on
# Screen width and distance in metres.
cinemasize 3.2 2.6

# ---- Performance ---------------------------------------------------------------
# Each eye is drawn with its own exact (off-center) field of view and fills
# the whole window: no pixels are wasted (before: about a third of every
# image was cropped away). Also needed for headsets with canted displays
# (Pimax and similar), whose eyes look slightly outwards.
# "offcenter off" = old symmetric image + crop.
offcenter on
# Game resolution = what SteamVR recommends for one eye (follows the SteamVR
# resolution slider; changed on the fly when it differs by more than 4%).
# "resolution window" = keep the window size from ResX/ResY.
resolution auto
# Dynamic resolution: when the GPU gets close to the headset frame time, the
# scene is drawn smaller (down to "dynres min" percent) instead of dropping to
# half frame rate; it goes back up when there is headroom. "dynres off".
dynres on
dynres min 65
# Virtual screen in stereo for in-engine cutscenes: two renders 0.4 IPD
# apart shown side by side on the screen (Bink movies stay flat).
# Experimental: "cinema3d on" to try it.
cinema3d off
# Hidden-area mesh: the pixels outside the lenses are rejected by the depth
# test (written at depth 0 when the scene depth is cleared), ~10-20% fewer
# shaded pixels. Experimental: "ham on" to try it.
ham off
# VR graphics preset: screen-space ambient occlusion and filtered distortion
# off (15-17% of GPU time each, and their noise differs between the eyes).
vrpreset on
# One frame of lag between the game and render threads, as in the game.
# "threadlag off" lowers latency by ~10 ms but costs a lot of frame rate in
# heavy fights (48-53 fps instead of 75-86 in chapter 1).
threadlag on
# Quest over Link: Meta's ASW, once engaged, locks the game at half rate
# (36 fps at 72 Hz) even with plenty of headroom. "off" = turned off through
# the Oculus Debug Tool when VR starts and set back to Auto when the game
# closes; "keep" = leave it alone.
linkasw off
# Index, Vive, Pimax, WMR: SteamVR Motion Smoothing forced off for this game
# only (SteamVR > Settings > Video > Per-application). "keep" = leave it.
motionsmoothing off
# Virtual Desktop: its Synchronous Spacewarp can do the same; it can only be
# changed in the Virtual Desktop Streamer app (set it to Disabled).
# Send each frame to the headset in the same tick it was drawn when the GPU
# has headroom (about one frame less latency on hands and gun).
lowlatency on
# Each eye keeps its own occlusion/LOD history, so objects do not pop in and
# out differently in the two eyes. "eyestate off" = shared, as the game does.
eyestate on
# Pixels sent to the headset per eye (1 = full resolution; 0.8 = smoother).
outputscale 1
# The desktop window is refreshed every N frames (preview only).
monitor 1
# D3D9Ex device with GPU-to-GPU copies (much faster). If the game misbehaves:
# gpushare off
gpushare on

# ---- External haptics -----------------------------------------------------------
# ProTubeVR ForceTube / ProVolver: install the free ProTubeVR Companion App
# (Steam) and pair the devices in Windows; recoil on every shot, scaled by
# weapon. The first device found is the gun hand, a second one the support
# hand: "protube swap" if they come out the wrong way round.
protube on
# bHaptics vest and arm sleeves: start the bHaptics Player; recoil on the arms,
# hits taken on the vest, grenade / melee / reload on the left arm.
bhaptics on

# ---- Updates -------------------------------------------------------------------
# Check GitHub for a newer version at start-up and install it for the next
# launch. "autoupdate off" to disable.
autoupdate on
# "stable" = tested releases only; "beta" = also test builds (pre-releases).
updatechannel stable

# Settings format version (updated automatically).
configversion 5
